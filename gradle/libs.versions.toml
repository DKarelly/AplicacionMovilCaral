[versions]
agp = "9.3.2"
gson = "2.14.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
constraintlayout = "2.2.2"
activityKtx = "1.13.0"
navigationFragment = "2.9.8"
navigationUi = "2.9.8"
retrofit = "3.1.0-SNAPSHOT"
retrofitVersion = "2.11.0"
volley = "1.2.1"
googleGmsGoogleServices = "4.5.0"
firebaseDatabase = "23.0.0"
